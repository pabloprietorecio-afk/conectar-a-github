<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Football Cards</title>
<style>
:root{--navpad:0px;--ink:#f2f7f4;--mute:#a7c4b8;--hi:#ffcf33;--good:#5fe39a;--bad:#ff6b5b;--me:#38bdf8;--rival:#fb7185;--cz:.74}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#06130e;color:var(--ink);font:15px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:var(--navpad)}
#hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 12px;background:#06130e;z-index:5;min-height:46px}
.sc{display:flex;align-items:center;gap:10px;font-weight:900;font-size:26px;letter-spacing:1px}
.sc small{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.5px}
.sc .t{display:flex;flex-direction:column;align-items:center;line-height:1}
.clock{font-weight:900;font-size:20px;color:var(--hi);text-align:center;line-height:1}.clock small{display:block;font-size:10px;color:var(--mute);font-weight:700}
.hudr{font-size:11px;color:var(--mute);text-align:right;line-height:1.35;display:flex;gap:8px;align-items:center}
.hudr button{background:#12302a;color:var(--ink);border:1px solid #2b5646;border-radius:10px;padding:6px 9px;font-size:16px}
/* campo */
#pitch{position:relative;flex:1;min-height:0;overflow:hidden;background:repeating-linear-gradient(180deg,#1b6b48 0 10%,#18603f 10% 20%);border-top:2px solid #0e3a28;border-bottom:2px solid #0e3a28;touch-action:none}
#pitch>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ov path,#ov line,#ov ellipse,#ov circle{vector-effect:non-scaling-stroke}
#ov .rng{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.7);stroke-width:2;stroke-dasharray:6 5}
#ov .me{stroke:var(--me);stroke-width:4;fill:none;stroke-linecap:round}
#ov .rv{stroke:var(--rival);stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:3 8;animation:dash .8s linear infinite}
#ov .thr{fill:rgba(255,90,90,.14);stroke:#ff6b5b;stroke-width:2;stroke-dasharray:4 3}
#ov .dst{fill:var(--hi);stroke:#000;stroke-width:2}
@keyframes dash{to{stroke-dashoffset:-22}}
#ball{position:absolute;font-size:22px;transform:translate(-50%,-50%);transition:top .8s cubic-bezier(.4,.1,.2,1),left .8s cubic-bezier(.4,.1,.2,1);z-index:9;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));pointer-events:none;line-height:1}
.pt{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);transition:top .9s ease,left .9s ease;z-index:3}
.pt .fc{width:100%;height:100%;border-radius:50%;overflow:hidden;border:2.5px solid var(--ring);background:#0b2a20;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.pt.me{--ring:var(--me)}.pt.rv{--ring:var(--rival)}
.pt svg{width:100%;height:100%;display:block}
.pt.gk .fc{border-style:dashed}
.pt.car{z-index:6}.pt.car .fc{box-shadow:0 0 0 3px #fff,0 0 12px #fff}
.pt.run .fc{animation:bob .2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.pt .lb{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1px;font-size:10px;font-weight:900;white-space:nowrap;text-shadow:0 1px 3px #000,0 0 3px #000;pointer-events:none}
.pt.elig,.pt.picked,.pt.foe,.pt.act{z-index:13}
.pt.elig{width:36px;height:36px;cursor:pointer}.pt.elig .lb,.pt.picked .lb,.pt.foe .lb,.pt.act .lb{display:block}
.pt.elig .fc{box-shadow:0 0 0 3px var(--hi),0 0 14px var(--hi);animation:eligp .9s ease-in-out infinite alternate}
@keyframes eligp{to{box-shadow:0 0 0 5px var(--hi),0 0 24px var(--hi)}}
.pt.picked{width:38px;height:38px}.pt.picked .fc{box-shadow:0 0 0 4px #fff,0 0 22px var(--good)}
.pt.foe{width:36px;height:36px}.pt.foe .fc{box-shadow:0 0 0 3px var(--rival),0 0 18px var(--rival);animation:eligp .9s ease-in-out infinite alternate}
.pt.act .fc{box-shadow:0 0 0 3px var(--hi),0 0 16px var(--hi)}
.pt .tag{position:absolute;top:-12px;right:-14px;min-width:20px;height:20px;border-radius:10px;background:var(--hi);color:#000;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #000}

#cine{position:fixed;inset:0;z-index:70;background:#000;overflow:hidden;animation:cfade .25s ease-out}
/* v13 · tanda de penaltis por gestos */
#tanda{position:fixed;inset:0;z-index:72;background:#000;overflow:hidden;touch-action:none;animation:cfade .3s ease-out}
#tanda .tk-cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tk-ui{position:absolute;inset:0;pointer-events:none}
.tk-hud{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);text-align:center;transition:opacity .15s,transform .15s}
.tk-hud.off{opacity:0;transform:translateY(-8px)}
.tkb{display:inline-flex;align-items:center;gap:7px;background:#000a;border-radius:14px;padding:6px 10px;font-weight:900;color:#fff;box-shadow:0 2px 10px #0008}
.tkb b{font-size:20px;letter-spacing:1px;margin:0 2px}.tkn{font-size:11px;letter-spacing:1px}.tkn.me{color:var(--me)}.tkn.rv{color:var(--rival)}
.tkd{display:inline-flex;gap:3px}.tkd i{width:15px;height:15px;border-radius:50%;border:1.5px solid #ffffff70;font-style:normal;font-size:10px;line-height:12px;color:#000;display:inline-block}
.tkd i.g{background:var(--good);border-color:var(--good)}.tkd i.x{background:var(--bad);border-color:var(--bad);color:#fff}
.tk-hud small{display:block;margin-top:4px;font-size:11.5px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;letter-spacing:.5px}
.tk-hud.qk{position:static;margin:10px 0}
.tk-pres{position:absolute;left:12px;right:12px;top:22%;opacity:0;transform:translateY(12px);transition:opacity .25s,transform .25s;pointer-events:auto}
.tk-pres.on{opacity:1;transform:none}
.tkp{background:linear-gradient(160deg,#0b1f18f2,#06130ef2);border:1px solid #2b5646;border-left:5px solid var(--me);border-radius:16px;padding:10px 12px;box-shadow:0 8px 30px #000a}
.tkp.rv{border-left-color:var(--rival)}.tkp>small{font-size:11px;letter-spacing:2px;color:var(--hi);font-weight:900}
.tkpr{display:flex;align-items:center;gap:10px;margin:6px 0}.tkpr .fc{width:54px;height:54px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--hi)}
.tkpr b{display:block;font-size:20px;font-weight:900}.tkpr em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.tka,.tkvs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--mute)}.tka b,.tkvs b{color:var(--ink)}.tkvs{margin-top:5px}
.tkst{margin-top:7px;display:inline-block;background:var(--hi);color:#000;font-weight:900;font-size:12px;border-radius:8px;padding:3px 8px}
.tk-line{position:absolute;left:16px;right:16px;top:62%;text-align:center;font-weight:800;font-size:15px;color:#fff;text-shadow:0 2px 6px #000;opacity:0;transition:opacity .3s}
.tk-line.on{opacity:1}.tk-line.low{top:76%}
.tk-hint{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;font-size:13px;font-weight:700;color:#fff;background:#000a;border-radius:12px;padding:7px 10px;opacity:0;transition:opacity .25s}
.tk-hint.on{opacity:1}
.tk-cap{position:absolute;left:14px;right:14px;top:calc(env(safe-area-inset-top,0px) + 74px);text-align:center;font-size:16px;font-weight:900;color:var(--hi);text-shadow:0 2px 6px #000;opacity:0;transition:opacity .25s}
.tk-cap.on{opacity:1}
.tk-cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:90px;font-weight:900;color:#fff;background:#0008;text-shadow:0 4px 0 #000}
.tk-cd.on{display:flex}
.tk-rep{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 70px);padding:4px 10px;border-radius:6px;background:#e11d48;color:#fff;font-weight:900;font-size:12px;letter-spacing:2px;opacity:0}
.tk-rep.on{opacity:1;animation:tkblink 1s infinite}
@keyframes tkblink{50%{opacity:.4}}
.tk-skip{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);min-height:46px;min-width:110px;padding:0 20px;border:2px solid #ffffffa0;border-radius:23px;background:#000c;color:#fff;font:900 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:1px;pointer-events:auto;touch-action:manipulation;display:none;box-shadow:0 3px 12px #000a}
.tk-skip.on{display:block;animation:cfade .25s ease-out}.tk-skip:active{background:#e11d48;border-color:#e11d48}
.tkcoin{display:flex;align-items:center;gap:10px;background:#0b1f18;border:1px solid #2b5646;border-radius:14px;padding:8px 12px;margin:6px 0;text-align:left;width:100%;max-width:360px}
.tkcoin .coin{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#5a3d00;background:radial-gradient(circle at 35% 30%,#fff3b0,#f2b705 55%,#a06a00);box-shadow:inset 0 0 0 3px #ffffff55,0 2px 6px #0008;animation:tkflip .9s ease-out}.tkcoin b{display:block}.tkcoin small{color:var(--mute)}
.tkcoin.w{border-color:var(--hi)}
/* v13 · menú principal sobre el estadio en 3D */
#mmbg{position:fixed;inset:0;z-index:29;background:#0a1a26;overflow:hidden}
#mmbg.off{display:none}
#mmbg .mmcv{position:absolute;inset:0;width:100%;height:100%;animation:cfade 1.2s ease-out}
#mmbg .mmsky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 28%,#2f6f8f 0,#123046 45%,#06130e 85%)}
#mmbg.flat .mmsky{background:radial-gradient(ellipse at 50% 30%,#1d5a43,#06130e 72%)}
#mmbg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#000a 0,#0000 22%,#0000 42%,#000b 100%);pointer-events:none}
#screen.mm{background:transparent;gap:10px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.mmlogo{text-align:center;text-shadow:0 3px 12px #000}
.mmlogo b{display:block;font-size:34px;line-height:.95;font-weight:900;letter-spacing:4px;color:#fff}
.mmlogo small{display:block;margin-top:6px;font-size:12px;font-weight:800;letter-spacing:2px;color:var(--hi);text-transform:uppercase}
.mmgap{flex:1 1 auto;min-height:24px}
.mmp{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;padding:14px 12px 12px;border-radius:22px;background:rgba(4,16,11,.58);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 40px #0009;-webkit-backdrop-filter:blur(9px) saturate(1.2);backdrop-filter:blur(9px) saturate(1.2)}
.mmp .btn.sec{background:rgba(29,77,58,.82)}
.mmp .btn.mmnew{background:rgba(23,92,128,.88);box-shadow:0 4px 0 #0b3550}
.mmp .note{margin:0 auto}
.mmst{font-size:10.5px;color:#ffffffa8;letter-spacing:.5px;text-shadow:0 1px 3px #000}
.pkvs{margin:4px 0}.pkvib{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
@keyframes tkflip{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-16px)}100%{transform:rotateY(1800deg)}}
@keyframes cfade{from{opacity:0}to{opacity:1}}
.cn-ui{position:absolute;inset:0;pointer-events:none}
.cn-bar{position:absolute;left:0;right:0;height:9%;background:#000;animation:cbar .5s ease-out both}
.cn-bar.top{top:0}.cn-bar.bot{bottom:0}
@keyframes cbar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cn-bar.top{transform-origin:top}.cn-bar.bot{transform-origin:bottom}
.cn-tag{position:absolute;left:14px;top:calc(9% + 12px);padding:7px 14px 7px 12px;background:linear-gradient(90deg,#000d,#000a 80%,#0000);border-left:5px solid var(--hi);font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 4px #000;animation:ctag .5s .2s ease-out both}
.cn-tag span{display:block;font-size:11px;letter-spacing:2px;color:var(--hi)}
.cn-tag small{display:block;font-size:12px;color:var(--mute);font-weight:700}
@keyframes ctag{from{transform:translateX(-120%)}to{transform:none}}
.cn-word{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:clamp(46px,17vw,84px);font-weight:900;font-style:italic;letter-spacing:2px;opacity:0;transform:translateY(-50%) scale(.2) rotate(-6deg);color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 6px 0 #000a,0 0 30px var(--c)}
.cn-word.gold{--c:#ffcf33;color:#ffd84a}.cn-word.good{--c:#5fe39a;color:#7dffb4}.cn-word.bad{--c:#ff6b5b;color:#ff9a8d}.cn-word.mute{--c:#a7c4b8;color:#dfe9e4}
.cn-word.show{animation:cword 1.5s ease-out forwards}
@keyframes cword{0%{opacity:0;transform:translateY(-50%) scale(.2) rotate(-6deg)}18%{opacity:1;transform:translateY(-50%) scale(1.25) rotate(-4deg)}30%{transform:translateY(-50%) scale(1) rotate(-4deg)}85%{opacity:1;transform:translateY(-50%) scale(1.06) rotate(-4deg)}100%{opacity:0;transform:translateY(-50%) scale(1.15) rotate(-4deg)}}
#pitch{background:
 radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.14),rgba(0,0,0,0) 62%),
 radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%),
/*TURF1*/
 repeating-linear-gradient(180deg,#1f7a50 0 10%,#176243 10% 20%);
 background-size:100% 100%,100% 100%,160px 160px,100% 100%}
.pt::before{content:"";position:absolute;left:12%;right:12%;bottom:-3px;height:7px;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(2px);z-index:-1}
.pt .fc{background:radial-gradient(circle at 35% 30%,#2a5a46,#0b2a20)}
#ball svg{width:100%;height:100%;display:block}
#ball{width:22px;height:22px;font-size:0}
/* narración sobre el campo */
#cap{position:absolute;left:8px;right:48px;top:8px;z-index:15;text-align:center;pointer-events:none;transition:opacity .25s}
#cap.hide{opacity:0}
body.pk.min #cap,body.pk.zoomf #cap{display:none}
#cap span{display:inline-block;max-width:100%;font-size:17px;font-weight:900;line-height:1.2;padding:7px 14px;border-radius:16px;background:#000c;border:2px solid var(--c,var(--hi));color:#fff;text-shadow:0 1px 2px #000}
#cap.good span{--c:var(--good)}#cap.bad span{--c:var(--bad)}#cap.rv span{--c:var(--rival)}
#duel{position:absolute;left:50%;transform:translateX(-50%);z-index:14;display:flex;align-items:center;gap:8px;background:#000d;border:2px solid var(--hi);border-radius:18px;padding:8px 10px;animation:pop .3s ease-out}
#duel .side{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px}
#duel .side .fc{width:54px;height:54px;border-radius:50%;overflow:hidden;border:3px solid var(--ring);background:#0b2a20}
#duel .side.me{--ring:var(--me)}#duel .side.rv{--ring:var(--rival)}
#duel .side .fc svg{width:100%;height:100%;display:block}
#duel .nm{font-size:12px;font-weight:800}
#duel .v{font-size:32px;font-weight:900;line-height:1}
#duel .dt{font-size:10px;color:var(--mute);font-weight:700;text-align:center;line-height:1.2}
#duel .vs{font-weight:900;color:var(--hi);font-size:14px}
#duel .vs.cn{width:64px;height:64px;perspective:320px;display:flex;align-items:center;justify-content:center}
.coin{width:54px;height:54px;position:relative;transform-style:preserve-3d}
.coin .cf{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:11px;line-height:1.05;color:#3a2a00;background:radial-gradient(circle at 35% 30%,#fff3b0,#f5c542 55%,#b8860b);border:3px solid #8a6508;backface-visibility:hidden;box-shadow:inset 0 0 0 3px #ffe58a88}
.coin .cf b{font-size:17px}
.coin .cf.b{transform:rotateY(180deg)}
#duel .dice.nd{visibility:hidden}
#duel .win .fc{box-shadow:0 0 0 4px var(--good),0 0 20px var(--good)}#duel .win .v{color:var(--good)}
#duel .lose{opacity:.55}
#duel .dice{height:56px;display:flex;align-items:center;justify-content:center;perspective:300px}
.die{--s:38px;width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d}
.die .f{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#111;background:linear-gradient(145deg,#fff,#d8d8d8);border:2px solid #222;border-radius:7px;backface-visibility:hidden}
.die .f:nth-child(1){transform:translateZ(19px)}
.die .f:nth-child(2){transform:rotateY(90deg) translateZ(19px)}
.die .f:nth-child(3){transform:rotateY(180deg) translateZ(19px)}
.die .f:nth-child(4){transform:rotateY(-90deg) translateZ(19px)}
.die .f:nth-child(5){transform:rotateX(90deg) translateZ(19px)}
.die .f:nth-child(6){transform:rotateX(-90deg) translateZ(19px)}
.die.me .f{background:linear-gradient(145deg,#e6f1ff,#9cc3f5)}.die.rv .f{background:linear-gradient(145deg,#ffe6e2,#f59f93)}
.die .sh{position:absolute;left:4px;right:4px;bottom:-14px;height:8px;border-radius:50%;background:#0008;filter:blur(3px)}
#duel .side.win .die{filter:drop-shadow(0 0 8px var(--good))}
#go .ico{width:22px;height:22px;vertical-align:-5px;margin-right:6px;display:inline-block}
#go.rolling .ico{animation:dspin .5s linear infinite}
@keyframes dspin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:translateX(-50%) scale(.4);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#reveal{position:absolute;left:0;right:0;z-index:14;display:flex;justify-content:center;gap:10px;animation:fadein .3s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#reveal .gc{zoom:.62}
#reveal .who{font-size:11px;font-weight:900;text-align:center;margin-bottom:2px}
#flash{position:absolute;left:0;right:0;top:36%;z-index:16;text-align:center;font-size:44px;font-weight:900;letter-spacing:2px;text-shadow:0 4px 18px #000;pointer-events:none;opacity:0}
#flash.show{animation:flash 1.5s ease-out}
@keyframes flash{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
.conf{position:absolute;top:-6%;font-size:24px;z-index:13;animation:fall 1.8s linear forwards}
@keyframes fall{to{top:104%;transform:rotate(540deg)}}
/* dock */
#dock{background:linear-gradient(#06130e,#0a1f17);padding-bottom:max(4px,env(safe-area-inset-bottom));z-index:12}
#bar{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:5px 10px}

.btn{padding:11px 20px;border-radius:14px;border:0;font-weight:900;font-size:16px;background:var(--hi);color:#000;box-shadow:0 4px 0 #b88f00;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b88f00}

body.min #chainb,body.zoomf #chainb{display:none}
.btn.sec.on{outline:3px solid var(--hi)}
.btn.sec{background:#1d4d3a;color:#fff;box-shadow:0 4px 0 #0c2a1e;padding:8px 12px;font-size:13px;line-height:1.1}

<script>
const __M = {};
__M.engine = (() => {
// Football Cards v4 — motor puro (sin DOM). Lo comparten la interfaz, los bots y el simulador.
//
// Campo continuo: x de 0 a 64 (ancho), y de 0 a 100 (largo), en metros aproximados. El bando 0 (jugador humano)
// ataca hacia y=0 y defiende y=100; el bando 1 al revés. Cada "mano" ambos bandos juegan una acción (con carta de
// refuerzo y/o especial opcionales) y una tirada de suerte.
// v4: los futbolistas cuentan. Su velocidad punta (km/h, dato real cuando existe) fija cuántos metros recorren,
// su posición y sus cualidades dan de −1 a +2 en cada duelo, y se cansan: la energía baja al correr y se
// recupera al descansar (y en el descanso del partido).

const FIELD = { W: 64, L: 100, GX: 32, GOAL_HALF: 6 };

const CFG = {
  base: 4, // nivel de todos los jugadores
  luck: 8, // (v3) ya no se usa: la suerte son dos dados de seis caras
  diceN: 2, diceF: 6, // la suerte: cada bando tira dos dados de seis caras (2 a 12)
  handSize: 5,
  minutes: 90,
  manoMin: 2, // minutos por mano (~40 manos por partido: con menos, los partidos acaban demasiado a menudo 0-0)
  shotMin: 3, // minutos si la mano termina en tiro
  cutBase: 7, // alcance base (m) para llegar a la trayectoria de un pase y cortarlo
  stars: 2, starBonus: 4, // Genialidades por partido y su bonus
  chainStep: 2, chainMax: 2, // cada 2 ataques seguidos con éxito: +1 a la fuerza de ataque (máx. +2)
  contact: 7, // distancia de contacto para duelos de posición
  tackleReach: 10, // alcance base de una entrada (+2 por punto de carta)
  moveBase: 8, // metros base de carrera/persecución/desmarque (+3 por punto de carta)
  movePer: 3,
  passPen: 15, // -1 al pase por cada 15 m
  centroPen: 25, // idem para el centro
  shotFree: 12, // sin penalización de distancia hasta aquí (v5: la mayoría de goles, desde dentro del área)
  shotPenDiv: 4, // -1 al tiro por cada 4 m más allá
  offStart: 20, // desde esta distancia el tiro puede irse fuera
  offSpan: 24, // probabilidad de ir fuera = (d - offStart) / offSpan (máx. offMax)
  offMax: 0.92,
  longFrom: 22, longDiv: 2.5, // desde 22 m, −1 más cada 2,5 m (los goles desde lejos son raros… salvo con Misil)
  farFrom: 36, farMax: 0.985, // desde 36 m casi todo se va fuera
  cardHalfFrom: 20, // desde 20 m la carta de Disparo vale la mitad (con Misil, entera)
  boxBonus: 1, // tiro desde dentro del área: +1
  gkMinus: 0, // el portero parte con este punto menos (v5: más goles cerca, los lejanos siguen siendo raros)
  despReach: 12,
  // --- v8: Despejar es una acción CON balón: lo manda largo, lejos de tu área, y es muy difícil de cortar ---
  clearBonus: 3, // +3 al despeje (nadie corta un balón largo y alto con facilidad); con la iniciativa (+2) son +5 sobre un pase
  clearDist: 32, // metros que viaja el despeje (32 a 42 hacia el campo rival)
  clearMaxProg: 55, // solo se puede despejar con el balón en tu campo (hasta el 55 % del terreno)
  clearCut: 0.6, // el alcance para cortarlo en el aire es un 60 % del de un corte normal
  step: 9, // metros que se recolocan los jugadores sin acción
  keeperStep: 3,
  foulMargin: 6, // si la entrada pierde por esta diferencia, es falta
  pressedPen: 2,
  holdMargin: 3, // el portero blocó si gana por tanto
  maxTurns: 160,
  // --- v4: futbolistas reales ---
  refSpeed: 33, // km/h de referencia: un jugador a 33 km/h recorre exactamente el alcance de la regla
  ballSlow: 0.9, // con el balón en los pies se corre algo menos
  // v13.2 · cansancio calibrado con 200 partidos entre bots (sin cambios): descanso ~73 % de media (el más cansado ~50 %),
  // tras el descanso ~88 %, final ~59 % (1 o 2 por equipo por debajo del 35 %). Antes: 94 % al descanso y 91 % al final.
  drain: 0.6, // energía que gasta cada metro de esprint (se multiplica por 1.45 − resistencia/100)
  jogDrain: 0.12, // fracción del gasto cuando solo se recoloca trotando
  baseDrain: 2.0, // energía que gasta cada mano todo el que está en el campo (× 1,45 − resistencia/100; × 90/minutos)
  rec: 0.8, rec2: 0.6, // energía que recupera por mano quien no corre (1ª y 2ª parte)
  halfRest: 15, // recuperación en el descanso
  tired: 35, exhausted: 15, // por debajo: −1 / −2 en los duelos
  extManos: 2, extNear: 30, // v14 · prolongación: tiradas de más y distancia (m) a la portería rival para concederla
  tieDice: true, // v14 · empate a puntos en un lance: desempate a dados
  varChance: 0.5, // el VAR anula el gol la mitad de las veces
  starMax: 3, // al encajar un gol se gana una Genialidad (máximo 3)
  pushFrom: 75, push: 1, // empuje final: desde el minuto 75 (en partidos de 40', desde el 33), el equipo que pierde suma +1 a sus ataques
  saveCorner: 0.4, blockCorner: 0.35, // rechaces y bloqueos que acaban en córner
  // --- v5 ---
  looseTie: 0.3, // balón suelto: si uno llega más de 0,3 s antes, es suyo; si no, disputa cuerpo a cuerpo
  anticip: 0.03, // cada punto de carta de Carrera/Persigue adelanta la salida 0,03 s (máx. 0,3 s con una +10)
  gkHands: 0.25, // el portero dentro de su área puede usar las manos: le cuenta como 0,25 s de ventaja
  turbo: 1.4, // súper velocidad: ×1,4 la velocidad punta en esa jugada
  misilBonus: 2, paradonBonus: 6, elasticaBonus: 6,
  superMargin: 4, // los bots solo gastan una súper si mejora mucho la jugada
  atkBonus: 0, atkFirst: 2, atkFirstShot: 3, // v7: el que tiene el balón declara primero (enseña su jugada) y por eso suma +2 en sus duelos y +3 en el tiro (calibrado con 200 partidos simulados: mismos goles que antes)
  homeBonus: 1, homeP: 0.5, // v9 · factor campo (Liga): +1 en la mitad de los duelos de ataque del local (600 partidos simulados: +3,4 puntos de victorias)
  botClear: 0.9, // v8: los bots despejan con el balón pegado a su área (valor por % de terreno dentro del 34 % propio)
  botPoss: 11, botTerr: 0.12, botThreat: 0.08, // valor de la posesión, del terreno y del peligro para los bots
};

// v12 · el empuje final escala con la duración: en un partido de 40' nunca se llegaba al minuto 75
const pushFromNow = () => Math.round(CFG.pushFrom * CFG.minutes / 90);
const ATTACK = ['pase', 'centro', 'carrera', 'regate', 'tiro', 'proteger', 'desmarque', 'despejar'];
const DEFENSE = ['entrada', 'persigue', 'posicion', 'corte', 'falta'];

// needs: qué hay que elegir en el campo.  card: tipo de carta que la refuerza.
const ACTIONS = {
  pase: { label: 'Pase', role: 'atk', card: 'pase', needs: 'mate', text: 'Pasa el balón a un compañero. Cuanto más lejos, más difícil.' },
  centro: { label: 'Centro', role: 'atk', card: 'pase', needs: 'mate', text: 'Pase largo y aéreo a un compañero (se penaliza menos la distancia). Lo refuerzan cartas de Pase o de Despeje.' },
  carrera: { label: 'Carrera', role: 'atk', card: 'carrera', needs: 'dest', text: 'Conduce el balón hacia un punto. Recorres más con una carta de Carrera.' },
  regate: { label: 'Regate', role: 'atk', card: 'regate', needs: 'rival', text: 'Regatea al rival que te sale al paso (si hace entrada o posición, su carta cuenta).' },
  tiro: { label: 'Tiro', role: 'atk', card: 'disparo', needs: 'none', text: 'Dispara a puerta. Cuanto más cerca, más probable el gol.' },
  proteger: { label: 'Proteger', role: 'atk', card: 'regate', needs: 'none', text: 'Cubres el balón con el cuerpo: +2 contra una entrada. Lo refuerzan cartas de Regate o de Posición.' },
  desmarque: { label: 'Desmarque', role: 'atk', card: 'carrera', needs: 'mate+dest', text: 'Un compañero sin balón se mueve a un hueco. El portador retiene el balón.' },
  entrada: { label: 'Entrada', role: 'def', card: 'entrada', needs: 'player', text: 'Entras al jugador con el balón. Si pierdes por mucho, puede ser falta.' },
  persigue: { label: 'Persigue', role: 'def', card: 'persigue', needs: 'player', text: 'Persigues al jugador con el balón y le presionas.' },
  posicion: { label: 'Posición', role: 'def', card: 'posicion', needs: 'player+dest', text: 'Te colocas en un punto: frenas carreras y pases que pasen cerca. El portero suma la carta a la parada.' },
  corte: { label: 'Corte', role: 'def', card: 'corte', needs: 'player+rival', text: 'Cortas el pase al rival que elijas.' },
  despejar: { label: 'Despejar', role: 'atk', card: 'despeje', needs: 'none', text: 'Con el balón en tu campo, lo mandas largo y alto lejos de tu área para evitar el riesgo. Es muy difícil de cortar (+3), pero el balón queda suelto y empieza una carrera por él. Lo refuerza la carta Despeje.' },
  falta: { label: 'Falta', role: 'def', card: null, needs: 'player', text: 'Haces falta táctica: paras la jugada pero regalas una falta (o penalti).' },
  disputa: { label: 'Disputa', role: 'both', card: 'carrera', needs: 'player', text: 'Balón suelto: corres a por él (vale Carrera o Persigue).' },
};

const SPECIALS = {
  pase_magistral: { name: 'Pase Magistral', roles: ['atk'], text: 'Tu pase no puede ser interceptado por posición o corte.' },
  // v7: tarjetas. No acompañan a una acción: se sacan cuando el rival te hace falta (amarilla: leve o grave; roja: grave)
  amarilla: { name: 'Tarjeta amarilla', roles: [], pre: true, ref: true, icon: 'amarilla', short: 'Amonesta al que te hace falta', text: 'Cuando el rival te hace una falta, se la puedes sacar al infractor: queda amonestado (−1 en sus entradas, persecuciones y faltas) y con una segunda amarilla, a la calle.' },
  roja: { name: 'Tarjeta roja', roles: [], pre: true, ref: true, icon: 'roja', short: 'Expulsa al que te hace falta grave', text: 'Ante una falta GRAVE del rival (entrada muy temeraria, en el área o cortando una ocasión clara), expulsas al infractor: su equipo juega con uno menos. Al portero no se le puede expulsar.' },
  // v7: se juega ANTES de declarar (no acompaña a una acción)
  pausa: { name: 'La Pausa', roles: ['atk'], pre: true, short: 'La defensa declara primero', text: 'Con el balón en tus pies y antes de declarar, obligas a la defensa rival a declarar primero (enseña su jugada y su carta). Después decides tú.' },
  aficion: { name: 'Afición', roles: ['atk', 'def'], text: '+3 a tu acción.' },
  cansancio: { name: 'Cansancio', roles: ['atk', 'def'], text: '−3 a la acción del rival.' },
  lesion: { name: 'Lesión Leve', roles: ['atk', 'def'], text: 'El rival descarta una carta al azar.' },

    const dt = out[1].t - out[0].t, first = dt >= 0 ? 0 : 1, tie = Math.abs(dt) <= CFG.looseTie;
    const F = out[first], S = out[1 - first];
    s.stats.carreras++;
    const pk = (o) => ({ side: o.side, i: o.i, t: Math.round(o.t * 100) / 100, d: Math.round(o.d), spd: Math.round(o.spd * 10) / 10, turbo: o.boost > 1, ant: o.ant, hands: o.hands > 0, act: o.act });
    let W = F, L = S;
    if (tie) {
      const A = strength(F.side, 'atk', 'disputa', 1, F.c, F.i), D = strength(S.side, 'atk', 'disputa', 0, S.c, S.i);
      let w;
      if (A.key === 'moneda' || D.key === 'moneda') w = rint(s, 2) ? 'att' : 'def';
      else w = A.v >= D.v ? 'att' : 'def';
      ev.push({ k: 'race', at: { ...Q }, a: pk(out[0]), b: pk(out[1]), first, tie: true, winner: w === 'att' ? F.side : S.side });
      duel('Balón dividido', A, F.i, D, S.i, w);
      if (w === 'def') { W = S; L = F; }
    } else ev.push({ k: 'race', at: { ...Q }, a: pk(out[0]), b: pk(out[1]), first, tie: false, winner: F.side });
    // el que pierde se queda donde le ha dado tiempo a llegar
    const lv = effKmh(s, L.side, L.i, L.boost) / 3.6, lp = P(L.side, L.i);
    move(L.side, L.i, moveToward(lp, Q, Math.max(0, Math.min(dist(lp, Q) - 1.8, runDist(W.t, lv)))), 1);
    R.race = { winner: W.side, i: W.i, t: W.t, other: L.t, tie };
    const sec = (t) => t.toFixed(1).replace('.', ',') + ' s';
    if (W.act === 'despejar') {
      move(W.side, W.i, Q, 1);
      text(nm(W.side, W.i) + ' llega antes (' + sec(W.t) + ') y despeja el balón.');
      clearance(W.side, P(W.side, W.i));
    } else {
      text(tie ? nm(W.side, W.i) + ' gana el balón dividido.' : nm(W.side, W.i) + ' llega antes al balón (' + sec(W.t) + ' contra ' + sec(L.t) + ').');
      winBall(W.side, W.i, Q, tie ? 'disputa' : 'carrera');
    }
  };

  // ============ PORTADOR ============
  const resolveCarry = () => {
    const att = s.ball.carrier.side, def = 1 - att, K = s.ball.carrier.i;
    const ap = plans[att], dp = plans[def];
    const kpos = { ...P(att, K) };
    const action = ap.action;
    let dact = dp.action;
    const spA = spKey(att, 'atk'), spD = spKey(def, 'def');
    // jugador defensor actuante
    let dj = dp.player != null && s.pos[def][dp.player] ? dp.player : nearest(s, def, kpos);
    if (s.sp && s.sp.type === 'penalti') dj = 0;
    const dpos0 = { ...P(def, dj) };
    const dcard = cardFor(def, dact);
    const dpow = dcard ? dcard.power : 0;
    const press = s.pressed && s.pressed.side === att && s.pressed.i === K ? -CFG.pressedPen : 0;
    s.pressed = null;
    let afterRun = null;

    // --- defensa: movimientos que no dependen del ataque (posición) ---
    let defPos = dpos0;
    if (dact === 'posicion' && dj !== 0) defPos = moveToward(dpos0, clampPt(dp.to || { x: kpos.x, y: kpos.y - dirY(att) * 8 }), R_(def, dj, CFG.moveBase + CFG.movePer * dpow));
    if (hold) defPos = outOfBox(defPos, att); // nadie entra en el área mientras el portero tiene el balón

    // tras una entrada o falta con consecuencia
    const afterFoulCheck = (A, D, spot) => {
      const m = CFG.foulMargin + (inBox(spot, def) ? 1 : 0);
      if (D.v + m <= A.v) { R.foul = { by: def, i: dj, on: att, vi: K, at: { ...spot }, sev: A.v - D.v >= m + 7 || (inBox(spot, def) && A.v - D.v >= m + 3) ? 'grave' : 'leve' }; }
    };

    if (dact === 'falta' && !['pase', 'centro'].includes(action) && dist(dpos0, kpos) > R_(def, dj, CFG.moveBase + 6)) {
      // el defensor está demasiado lejos para hacer falta: solo corre hacia el balón
      text(nm(def, dj) + ' llega tarde: no alcanza a ' + nm(att, K) + ' para hacer falta.', 'bad');
      move(def, dj, moveToward(dpos0, kpos, R_(def, dj, CFG.moveBase + 4)), 1);
      dact = 'persigue';
    }
    if (dact === 'falta' && !['pase', 'centro'].includes(action)) {
      // falta táctica: se para la jugada
      move(def, dj, kpos, 1);
      text(nm(def, dj) + ' hace falta táctica sobre ' + nm(att, K) + '.', 'bad');
      R.foul = { by: def, i: dj, on: att, vi: K, at: { ...kpos }, tactical: true, sev: dist(kpos, { x: 32, y: ownGoalY(def) }) < 19 ? 'grave' : 'leve' }; // cortar una ocasión clara junto al área es grave
      return;
    }

    // ---------- DESPEJAR (v8: con el balón, lejos de tu área) ----------
    // El balón sale largo y alto hacia el campo rival. Es mucho más fácil de ganar que un pase: lleva +clearBonus y solo lo estorba
    // quien le sale al paso al que despeja (Entrada) o quien está cerca de la trayectoria o de la zona de caída (Corte / Posición).
    if (action === 'despejar') {
      const A = strength(att, 'atk', 'despejar', CFG.clearBonus + press, undefined, K);
      used[att].card = A.card ? ap.card : null;
      const cx = kpos.x + (32 - kpos.x) * 0.35;
      const to = { x: cx + (s.rng() - 0.5) * 32, y: kpos.y + dirY(att) * (CFG.clearDist + s.rng() * 10) };
      const land = { x: clamp(to.x, 1, 63), y: clamp(to.y, 4, 96) };
      let blocker = null, how = null, catchAt = null;
      if (dact === 'entrada') {
        const reach = R_(def, dj, CFG.tackleReach + 2 * dpow);
        move(def, dj, moveToward(dpos0, kpos, reach + 4), 1);
        if (dist(dpos0, kpos) <= reach) {
          const D = strength(def, 'def', 'entrada', 0, undefined, dj);
          used[def].card = D.card ? dp.card : null;
          const w = contest(A, D);
          duel('Despeje contra entrada', A, K, D, dj, w);
          if (w === 'def') { blocker = dj; how = 'block'; }
        }
      } else if (dact === 'corte' || dact === 'posicion') {
        const D = strength(def, 'def', dact, 0, undefined, dj);
        used[def].card = D.card ? dp.card : null;
        let canCut;
        if (dact === 'posicion') {
          move(def, dj, defPos, 1);
          const sc = segInfo(P(def, dj), kpos, land); catchAt = sc.c;
          canCut = dj !== 0 && sc.d <= CFG.contact && sc.t > 0.15;
        } else {
          const reach = R_(def, dj, CFG.cutBase + 1.5 * dpow) * CFG.clearCut;
          const sc = segInfo(dpos0, kpos, land), dl = dist(dpos0, land);
          catchAt = dl <= sc.d ? land : sc.c;
          canCut = dj !== 0 && Math.min(dl, sc.d) <= reach && sc.t > 0.15;
          move(def, dj, moveToward(dpos0, catchAt, reach + 3), 1);
        }
        if (canCut) {
          const w = contest(A, D);
          duel('Despeje contra ' + (dact === 'corte' ? 'corte' : 'posición'), A, K, D, dj, w);
          if (w === 'def') { blocker = dj; how = 'air'; }
        }
      } else if (dact === 'persigue') {
        move(def, dj, moveToward(dpos0, kpos, R_(def, dj, CFG.moveBase + CFG.movePer * dpow)), 1);
        used[def].card = dcard ? dp.card : null;
      }
      if (how === 'block') {
        text(nm(def, blocker) + ' bloquea el despeje de ' + nm(att, K) + '.', 'bad');
        ball({ x: kpos.x + (s.rng() - 0.5) * 4, y: kpos.y + dirY(att) * 2 }, null, 'rebote');
      } else if (how === 'air') {
        text(nm(def, blocker) + ' gana el balón en el aire.', 'bad');
        winBall(def, blocker, clampPt(catchAt), 'intercepta');
        if (spD === 'contraataque') contra(def, blocker);
      } else if (to.x < 0 || to.x > 64) {
        text(nm(att, K) + ' despeja largo, pero el balón se va por la banda.');
        ev.push({ k: 'ball', from: { x: s.ball.x, y: s.ball.y }, to: clampPt(land), carrier: null, style: 'despeje' });
        throwIn(def, { x: to.x, y: clamp(land.y, 8, 92) });
      } else {
        text(nm(att, K) + ' despeja largo, lejos del área.');
        ball(land, null, 'despeje');
      }
      return;
    }

    // ---------- PASE / CENTRO ----------
    if (action === 'pase' || action === 'centro') {
      const gP = goalPt(att), inBox = Math.abs(kpos.y - gP.y) <= 18 && Math.abs(kpos.x - FIELD.GX) <= 18;
      if (s.sp && s.sp.type === 'falta' && s.sp.side === att && !inBox) { fkFav = att; text('Saque de falta: el pase sale con ventaja.'); }
      const T = ap.target != null && ap.target !== K && s.pos[att][ap.target] ? ap.target : nearest(s, att, kpos, (k) => k !== K && k !== 0);
      const Tpos = { ...P(att, T) };
      const d = dist(kpos, Tpos);
      let extra = -Math.floor(d / (action === 'centro' ? CFG.centroPen : CFG.passPen)) + press;
      // pase de seguridad: hacia atrás o al compañero de al lado (casi imposible de cortar)
      const progA = (y) => (att === 0 ? 100 - y : y), safeP = action === 'pase' && progA(Tpos.y) - progA(kpos.y) <= 2 && d <= 18;
      if (safeP) extra += 2;
      R.safePass = safeP;
      const A = strength(att, 'atk', action, extra, undefined, K);
      used[att].card = A.card ? ap.card : null;
      s.stats.pases++;
      let result = 'ok', blocker = null;
      const crowd = s.sp && s.sp.type === 'corner' ? Math.min(3, s.pos[def].filter((q, k) => k !== 0 && k !== dj && dist(q, Tpos) < 8).length) : 0;
      const aerial = action === 'centro' ? 2 : 0;
      if (ko) {
        // saque de centro: el rival no juega nada, el pase siempre llega
        move(def, dj, moveToward(dpos0, { x: (kpos.x + Tpos.x) / 2, y: (kpos.y + Tpos.y) / 2 }, 4), 1);
      } else if (dact === 'corte') {
        const D = strength(def, 'def', 'corte', crowd, undefined, dj);
        used[def].card = D.card ? dp.card : null;
        // el defensor solo puede cortar si llega a la trayectoria del pase (más lejos si es rápido y está fresco)
        const cutReach = R_(def, dj, CFG.cutBase + 1.5 * dpow);
        const sc = segInfo(dpos0, kpos, Tpos);
        // el rival debe estar en la zona entre pasador y receptor (y fuera del área si saca el portero)
        const canCut = sc.d <= cutReach && dj !== 0 && sc.t > 0.08 && sc.t < 0.96 && !(hold && outOfBox(sc.c, att) !== sc.c);
        let cutTo = moveToward(dpos0, canCut ? sc.c : { x: kpos.x + (Tpos.x - kpos.x) * 0.55, y: kpos.y + (Tpos.y - kpos.y) * 0.55 }, cutReach);
        if (hold) cutTo = outOfBox(cutTo, att);
        move(def, dj, cutTo, 1);
        if (dp.target === T && canCut) {
          const w = contest(A, D);
          duel('Pase contra corte', A, K, D, dj, w);
          if (w === 'def' && spA !== 'pase_magistral') { result = 'inter'; blocker = dj; }
        }
      } else if (dact === 'posicion') {
        const D = strength(def, 'def', 'posicion', crowd, undefined, dj);
        used[def].card = D.card ? dp.card : null;
        move(def, dj, defPos, 1);
        const si = segInfo(P(def, dj), kpos, Tpos);
        if (dj !== 0 && si.d <= CFG.contact && si.t > 0.08 && si.t < 0.96 && spA !== 'pase_magistral') {
          const w = contest(A, D);
          duel('Pase contra posición', A, K, D, dj, w);
          if (w === 'def') { result = 'inter'; blocker = dj; }
        }
      } else if (dact === 'entrada') {
        const reach = R_(def, dj, CFG.tackleReach + 2 * dpow);
        move(def, dj, moveToward(dpos0, kpos, reach + 4), 1);
        if (dist(dpos0, kpos) <= reach) {
          const D = strength(def, 'def', 'entrada', 0, undefined, dj);
          used[def].card = D.card ? dp.card : null;
          const w = contest(A, D);
          duel('Pase contra entrada', A, K, D, dj, w);
          if (w === 'def') { result = 'block'; blocker = dj; }
        }
      } else if (dact === 'despejar') {
        const reach = R_(def, dj, CFG.despReach + 2 * dpow);
        const si = segInfo(dpos0, kpos, Tpos);
        const toward = moveToward(dpos0, si.c, reach);
        move(def, dj, toward, 1);
        if (si.d <= reach && si.t > 0.08 && si.t < 0.96) {
          const D = strength(def, 'def', 'despejar', crowd + aerial, undefined, dj);
          used[def].card = D.card ? dp.card : null;
          const w = contest(A, D);
          duel('Pase contra despeje', A, K, D, dj, w);
          if (w === 'def') { result = 'clear'; blocker = dj; }
        }
      } else if (dact === 'persigue') {
        move(def, dj, moveToward(dpos0, Tpos, R_(def, dj, CFG.moveBase + CFG.movePer * dpow)), 1);
        used[def].card = dcard ? dp.card : null;
      } else {
        move(def, dj, moveToward(dpos0, kpos, R_(def, dj, CFG.moveBase)), 1);
      }
      if (result === 'ok') {
        text(nm(att, K) + ' pasa a ' + nm(att, T) + ' (' + A.v + ').');
        ball(Tpos, { side: att, i: T }, action === 'centro' ? 'centro' : 'pase');
        if (s.sp && s.sp.type === 'corner') text('¡El centro llega al área!');
      } else if (result === 'inter') {
        text(nm(def, blocker) + ' intercepta el pase.', 'bad');
        winBall(def, blocker, P(def, blocker), 'intercepta');
        if (spD === 'contraataque') contra(def, blocker);
      } else if (result === 'block') {
        text(nm(def, blocker) + ' bloquea el pase con la entrada.', 'bad');
        ball({ x: kpos.x + (Tpos.x - kpos.x) * 0.1, y: kpos.y + (Tpos.y - kpos.y) * 0.1 }, null, 'rebote');
      } else if (result === 'clear') {
        text(nm(def, blocker) + ' despeja el balón.', 'bad');
        clearance(def, P(def, blocker));
      }
      fkFav = null;
      return;
    }

    // ---------- CARRERA ----------
    if (action === 'carrera') {
      const cc = cardFor(att, 'carrera');
      used[att].card = cc ? ap.card : null;
      const r = R_(att, K, CFG.moveBase + CFG.movePer * (cc ? cc.power : 0));
      let Q = clampPt(moveToward(kpos, clampPt(ap.to || { x: kpos.x, y: kpos.y + dirY(att) * r }), r));
      const A = strength(att, 'atk', 'carrera', press, cc, K);
      let stop = null, tackled = null;
      if (dact === 'entrada') {
        const reach = R_(def, dj, CFG.tackleReach + 2 * dpow);
        const si = segInfo(dpos0, kpos, Q);
        if (si.d <= reach) {
          const D = strength(def, 'def', 'entrada', 0, undefined, dj);
          used[def].card = D.card ? dp.card : null;
          const w = contest(A, D);
          duel('Carrera contra entrada', A, K, D, dj, w);
          move(def, dj, si.c, 1);
          if (w === 'def') { tackled = { at: si.c }; }
          else { afterFoulCheck(A, D, si.c); }
        } else move(def, dj, moveToward(dpos0, si.c, reach + 4), 1);
      } else if (dact === 'posicion') {
        const D = strength(def, 'def', 'posicion', 0, undefined, dj);
        used[def].card = D.card ? dp.card : null;
        move(def, dj, defPos, 1);
        const si = segInfo(P(def, dj), kpos, Q);
        if (dj !== 0 && si.d <= CFG.contact) {
          const w = contest(A, D);
          duel('Carrera contra posición', A, K, D, dj, w);
          if (w === 'def') stop = moveToward(kpos, si.c, 1e9);
        }
      } else if (dact === 'persigue') {
        used[def].card = dcard ? dp.card : null;
        move(def, dj, moveToward(dpos0, Q, R_(def, dj, CFG.moveBase + CFG.movePer * dpow)), 1);
        if (dist(P(def, dj), Q) <= CFG.contact + 1) { s.pressed = { side: att, i: K }; text(nm(def, dj) + ' le pisa los talones: ' + nm(att, K) + ' sale presionado.'); }
      } else if (dact === 'corte' || dact === 'despejar') {
        move(def, dj, moveToward(dpos0, dact === 'corte' && dp.target != null && s.pos[att][dp.target] ? P(att, dp.target) : Q, R_(def, dj, CFG.moveBase + 4)), 1);
      }
      if (tackled) {
        const at = tackled.at;
        text(nm(def, dj) + ' le quita el balón a ' + nm(att, K) + ' con una entrada.', 'bad');
        move(att, K, at, 1);
        winBall(def, dj, P(def, dj), 'entrada');
        if (spD === 'contraataque') contra(def, dj);
      } else {
        const end = stop || Q;
        move(att, K, end, 1);
        text(nm(att, K) + (stop ? ' es frenado por la posición de ' + nm(def, dj) + '.' : ' conduce el balón ' + Math.round(dist(kpos, end)) + ' m.'));
        ball(end, { side: att, i: K }, 'carrera');
      }
      return;
    }

    // ---------- REGATE ----------
    if (action === 'regate') {
      const cc = cardFor(att, 'regate');
      used[att].card = cc ? ap.card : null;
      // oponente del regate: el defensor que hace entrada/posición si está cerca; si no, el más cercano
      let target = null;
      if ((dact === 'entrada' || dact === 'posicion') && dist(dpos0, kpos) <= 22) target = dj;
      else if (ap.target != null && s.pos[def][ap.target] && dist(P(def, ap.target), kpos) <= 22) target = ap.target;
      else { const n = nearest(s, def, kpos); if (n >= 0 && dist(P(def, n), kpos) <= 18) target = n; }
      s.stats.regates++;
      if (target === null) {
        const Q = moveToward(kpos, { x: kpos.x, y: kpos.y + dirY(att) * 10 }, R_(att, K, 10));
        text(nm(att, K) + ' avanza sin oposición.');
        if (dact !== 'falta') move(def, dj, moveToward(dpos0, Q, R_(def, dj, CFG.moveBase)), 1);
        move(att, K, Q, 1); ball(Q, { side: att, i: K }, 'carrera');
        return;
      }
      const A = strength(att, 'atk', 'regate', press, cc, K);
      R.regateBy = att;
      let D;
      if (target === dj && (dact === 'entrada' || dact === 'posicion')) { D = strength(def, 'def', dact, 0, undefined, dj); used[def].card = D.card ? dp.card : null; }
      else D = strength(def, 'def', 'regate_pasivo', 0, null, target); // defensor sin carta
      const tp = { ...P(def, target) };
      if (target === dj) move(def, dj, moveToward(dpos0, kpos, R_(def, dj, CFG.moveBase)), 1);
      else if (dact === 'persigue') move(def, dj, moveToward(dpos0, kpos, R_(def, dj, CFG.moveBase + CFG.movePer * dpow)), 1);
      else move(def, dj, moveToward(dpos0, kpos, R_(def, dj, CFG.moveBase)), 1);
      const w = contest(A, D);
      duel('Regate', A, K, D, target, w);
      if (w === 'att') {
        const Q = clampPt({ x: tp.x + (kpos.x <= tp.x ? -7 : 7), y: tp.y + dirY(att) * 9 });
        text(nm(att, K) + ' regatea a ' + nm(def, target) + ' (' + A.v + ' contra ' + D.v + ').', 'good');
        move(att, K, Q, 1); ball(Q, { side: att, i: K }, 'regate');
        if (dact === 'entrada' && target === dj) afterFoulCheck(A, D, Q);
      } else {
        text(nm(def, target) + ' le gana el regate a ' + nm(att, K) + ' y roba el balón.', 'bad');
        move(att, K, kpos, 1);
        winBall(def, target, moveToward(tp, kpos, 3), 'regate');
        if (spD === 'contraataque') contra(def, target);
      }
      return;
    }

    // ---------- TIRO ----------
    if (action === 'tiro') {
      const g = goalPt(att), cc = cardFor(att, 'tiro');
      used[att].card = cc ? ap.card : null;
      R.shot = true; s.stats.tiros++;
      const misil = spA === 'misil'; R.misil = misil ? att : null;
      const pen = shotPen(s, att, kpos, misil);
      // Paradón (súper del portero rival): su carta de Disparo no cuenta
      const ccEff = spD === 'paradon' ? null : cc ? { ...cc, power: shotCardPow(s, att, kpos, cc, misil) } : cc;
      const A = strength(att, 'atk', 'tiro', -pen + press, ccEff, K);
      let blocked = null;
      const keeperActs = dj === 0 && ['posicion', 'despejar', 'entrada'].includes(dact);
      if (s.sp && s.sp.type === 'penalti') { /* sin bloqueo */ }
      else if (dact === 'entrada' && dj !== 0) {
        const reach = R_(def, dj, CFG.tackleReach + 2 * dpow);
        move(def, dj, moveToward(dpos0, kpos, reach + 4), 1);
        if (dist(dpos0, kpos) <= reach) {
          const D = strength(def, 'def', 'entrada', 0, undefined, dj);
          used[def].card = D.card ? dp.card : null;
          const w = contest(A, D);
          duel('Tiro contra entrada', A, K, D, dj, w);
          if (w === 'def') blocked = { by: dj, how: 'entrada' };
        }
      } else if ((dact === 'posicion' || dact === 'despejar') && dj !== 0) {
        const D = strength(def, 'def', dact, 0, undefined, dj);
        used[def].card = D.card ? dp.card : null;
        const to = dact === 'posicion' ? defPos : moveToward(dpos0, segInfo(dpos0, kpos, g).c, R_(def, dj, CFG.despReach + 2 * dpow));
        move(def, dj, to, 1);
        const si = segInfo(P(def, dj), kpos, g);
        if (si.d <= CFG.contact) {
          const w = contest(A, D);
          duel('Tiro contra ' + (dact === 'posicion' ? 'posición' : 'despeje'), A, K, D, dj, w);
          if (w === 'def') blocked = { by: dj, how: dact };
        }
      } else if (dact === 'persigue' || dact === 'corte') {

<li><b>Progresión:</b> cada partido da <b>dinero</b> (más si ganas y marcas) y experiencia. Tus futbolistas <b>suben de nivel</b> jugando y entrenando (Reserva → Titular → Crack → Leyenda). Con el dinero <b>fichas</b> en el mercado, abres sobres de cartas y <b>mejoras el vestuario</b>. Hay <b>misiones diarias y semanales</b>, un <b>pase de temporada</b> gratis de 40 niveles (cada 4 semanas), un calendario de 7 días que no se reinicia si faltas, premio por rachas de victorias y por la primera victoria del día, y una <b>ruta de recompensas</b>. Los sobres tienen <b>garantía</b> (una Épica como mucho cada 10 y una Legendaria o SÚPER cada 30) y las cartas que ya no mejoran tu mazo se convierten en <b>fichas</b> para el Taller.</li>
<li><b>Fichas del campo:</b> toca (o mantén pulsada) una ficha para ver la carta del futbolista.</li>
<li><b>Gestos:</b> toca una carta para elegirla · desliza hacia delante para jugarla · mantén pulsada para verla grande · toca las cartas de la mesa para agrandarlas.</li></ul>`;
  const rar = Object.entries(POWER).map(([k, v]) => `${{ C: 'Común', U: 'Infrecuente', R: 'Rara', E: 'Épica', L: 'Legendaria' }[k]} +${v}`).join(' · ');
  return `<h3>Objetivo y tiempo</h3><p>Gana quien marque más goles en 90 minutos. Cada mano gasta ${CFG.manoMin} minutos y cada tiro ${CFG.shotMin}. Si acaba empatado, hay una tanda de penaltis.</p>
<h3>La fuerza y la suerte</h3><p>Cada acción tiene una fuerza: <b>${CFG.base}</b> (base) <b>+ carta</b> (de +2 a +10 según la rareza) <b>+ futbolista</b> (de −1 a +2) <b>+ extras</b> (distancia, presión…) <b>+ dos dados</b> de seis caras (de 2 a 12; lo más frecuente es sacar 7). Gana la mayor; en caso de empate, gana el defensor. Por eso un 10 no siempre vence a un 7. Trébol: tiras los dos dados dos veces y te quedas con la mejor tirada; Gafe: el rival se queda con la peor.</p>
<h3>Portero con el balón</h3><p>Cuando el portero atrapa el balón (tras una parada, al ganar un balón suelto en su área o en un saque de puerta), el área se despeja: los rivales salen y nadie puede hacerle una entrada, perseguirle ni hacerle falta. El portero solo puede sacar con un pase o un saque largo, y el rival solo puede intentar cortar ese saque (fuera del área) o colocarse.</p>
<h3>Los futbolistas</h3><p><b>Velocidad:</b> cada futbolista tiene su velocidad punta en km/h. Cuando existe, es un dato <b>medido en partido oficial</b> (Premier League, Bundesliga, LaLiga, UEFA o CIES; por ejemplo Salah 36,64 km/h o Mbappé 35,7 km/h); si no, es una <b>estimación</b> por posición y estilo. Los metros que recorre al correr, perseguir, desmarcarse, entrar o cortar se multiplican por su velocidad / ${CFG.refSpeed} km/h. Con el balón en los pies corre un ${Math.round((1 - CFG.ballSlow) * 100)} % menos.</p>
<p><b>Cualidades:</b> en cada duelo cuenta la cualidad de esa acción (Pase, Regate, Tiro, Defensa, Físico, Velocidad o Portero): 90 o más, +2; 80 o más, +1; menos de 66, −1. Así un central gana más entradas y un delantero define mejor. Las rarezas y estas cualidades son valores de diseño del juego.</p>
<p><b>Cansancio:</b> el partido cansa a todos los que están en el campo, aunque no esprinten, y cada esprint gasta energía (las dos cosas, más cuanta menos resistencia tenga el jugador; los centrocampistas son los que más aguantan, como en la realidad, donde son los que más kilómetros recorren). Quien no corre recupera un poco cada mano y todos recuperan ${CFG.halfRest} en el descanso. Con poca energía corre menos y resta 1 (o 2 si está agotado).</p>
<h3>Turnos</h3><p>Declara primero el equipo que tiene el balón: enseña su acción y su carta (las ves en la mesa o, con el campo en zoom, en grande sobre el campo) y la defensa responde. Por enseñar la jugada, el que ataca suma +${CFG.atkFirst} en sus duelos y +${CFG.atkFirstShot} en el tiro. Si el balón está suelto, nadie lo tiene y la iniciativa se alterna.</p><h3>🟨🟥 Tarjetas</h3><p>Cada mazo lleva dos tarjetas amarillas y una roja. No acompañan a una acción: cuando el rival te hace una falta y tienes una en la mano, el juego te pregunta si se la sacas al infractor. Una falta es <b>grave</b> si la entrada pierde el duelo por muchísimo, si es dentro del área por bastante, o si es una falta táctica junto al área (cortar una ocasión clara); las demás son <b>leves</b>. La amarilla vale para las dos; la roja, solo para las graves. Amonestado: −1 en entradas, persecuciones y faltas el resto del partido; segunda amarilla, expulsión. Un expulsado sale del campo y no vuelve. El portero puede ver amarilla, pero no se le expulsa.</p><h3>⏸ La Pausa</h3><p>Cada mazo lleva dos. Solo se juega con el balón en tus pies y antes de declarar: obliga a la defensa a declarar primero (acción y carta) y luego decides tú. Esa mano no sumas la iniciativa. El rival también la usa, sobre todo cerca de tu área: entonces te toca declarar primero tu defensa.</p>
<h3>Balón suelto: una carrera de verdad</h3><p>Cuando el balón queda suelto (un rechace, un despeje…), gana quien <b>llega antes</b>. El tiempo sale de la distancia y de la velocidad punta real de cada futbolista, con un modelo de aceleración de esprint (unos 1,8 s para 10 m y 4 s para 30 m a 33 km/h, como en las pruebas de futbolistas profesionales). El cansancio le resta velocidad y el portero, dentro de su área, cuenta con ${String(CFG.gkHands).replace('.', ',')} s de ventaja porque puede usar las manos. Una carta de Carrera o Persigue adelanta la salida ${String(CFG.anticip).replace('.', ',')} s por punto (como mucho ${String(CFG.anticip * 10).replace('.', ',')} s). Si la diferencia es de ${String(CFG.looseTie).replace('.', ',')} s o menos, hay <b>disputa cuerpo a cuerpo</b>: Físico + carta + dados, con +1 para el que llega antes. La carta súper <b>Súper velocidad</b> multiplica la velocidad por ${String(CFG.turbo).replace('.', ',')}.</p>
<h3>Puestos</h3><p>Puestos: POR (portero) · LD y LI (laterales) · DFC (central) · MCD (pivote) · MC (mediocentro) · MCO (mediapunta) · MD y MI (interiores de banda) · ED y EI (extremos) · DC (delantero centro). Cada formación pide unos: el 4-4-2, LI-DFC-DFC-LD, MI-MC-MC-MD y dos DC; el 4-3-3, extremos y un pivote; el 4-2-3-1, dos pivotes, mediapunta y extremos; el 3-5-2 y el 3-4-3, tres centrales con interiores de banda; el 5-3-2, laterales, tres centrales y un pivote. El puesto de cada futbolista real es el más conocido de su carrera.</p>
<h3>Formaciones</h3><ul class="rl">${Object.entries(FORMS).map(([k, f]) => `<li><b>${k} · ${f.style}:</b> ${Object.keys(f.mod).length ? Object.entries(f.mod).map(([a, v]) => (v > 0 ? '+' : '−') + Math.abs(v) + ' ' + ACTIONS[a].label.toLowerCase()).join(', ') : 'sin puntos débiles'}${f.line ? (f.line > 0 ? ' · defensa adelantada' : ' · defensa hundida') : ''}.</li>`).join('')}</ul><p>La formación decide dónde están tus futbolistas y, por tanto, quién llega antes a cada balón y a quién puedes pasar. Un futbolista colocado fuera de su posición (un centrocampista de delantero, por ejemplo) juega con −1.</p>
<h3>Acciones con balón</h3><table class="tb"><tr><th>Acción</th><th>Qué hace</th><th>Carta</th></tr>${rowsOf(ATTACK)}</table>
<p>Distancias: pase −1 por cada ${CFG.passPen} m, centro −1 por cada ${CFG.centroPen} m. Carrera: ${CFG.moveBase} m + ${CFG.movePer} m por punto de carta. El campo mide 100 m de largo.</p>
<h3>Acciones sin balón</h3><table class="tb"><tr><th>Acción</th><th>Qué hace</th><th>Carta</th></tr>${rowsOf(DEFENSE)}</table>
<p>Tú eliges qué jugador actúa; por defecto, el más cercano. Contra un tiro, la Posición suma al portero.</p>
<h3>Tiro a puerta</h3><p>Puedes tirar cuando quieras si tienes el balón. Cada ${CFG.shotPenDiv} m de distancia más allá de ${CFG.shotFree} m restan 1. Desde ${CFG.longFrom} m cada ${CFG.longDiv} m restan 1 más. Desde dentro del área suma +${CFG.boxBonus}. Desde más de ${CFG.cardHalfFrom} m la carta de Disparo vale la mitad. Desde más de ${CFG.offStart} m el balón puede irse fuera antes de llegar al portero, y desde más de ${CFG.farFrom} m casi siempre se va fuera: un gol desde el centro del campo es rarísimo, como en la realidad (salvo con la carta Misil, que no se va fuera, cuenta la carta entera y solo resta la mitad de la distancia). El portero detiene si su fuerza es mayor. Los defensas pueden bloquear con entrada o posición.</p>
<h3>Cartas</h3><p>La mano tiene ${CFG.handSize} cartas. Cada carta refuerza <b>un tipo</b> de acción: ${Object.values(CARD_TYPES).map((c) => c.name).join(', ')}. Rarezas: ${rar}. La carta usada va al descarte y la mano se rellena; cuando el mazo se acaba, se baraja el descarte.</p>
<h3>Genialidad, cadena y empuje final</h3><p><b>⭐ Genialidad:</b> empiezas con dos; puedes activarla antes de jugar: tu duelo principal de esa mano suma +${CFG.starBonus} (solo se gasta si hay duelo). Cada vez que te marcan ganas una más (hasta ${CFG.starMax}). <b>📣 Empuje final:</b> desde el minuto ${CFG.pushFrom}, el equipo que va perdiendo suma +${CFG.push} a sus ataques. <b>⛓ Cadena:</b> cada ${CFG.chainStep} ataques seguidos con éxito (pase, centro, carrera o regate sin perder el balón) tus acciones de ataque suman +1 (hasta +${CFG.chainMax}); se pierde al perder el balón o tirar.</p>
<h3>Robar</h3><p>En cada mano puedes robar <b>una</b> carta del mazo (una sola vez). Al robarla te aparece un cuadro con tres opciones: <b>Usarla</b> en esta jugada, <b>Cambiarla</b> por una carta de tu mano (la que sueltas se descarta y te quedas la robada) o <b>Tirarla</b>. Si la robada no se usa, se descarta. El rival hace lo mismo cada mano.</p>
<h3>Cartas especiales</h3><ul class="rl">${Object.values(SPECIALS).filter((s) => !s.super).map((s) => `<li><b>${s.name}:</b> ${s.text}</li>`).join('')}</ul><p>Se juega una especial a la vez, junto a una carta normal.</p>
<h3>Cartas SÚPER</h3><ul class="rl">${Object.values(SPECIALS).filter((s) => s.super).map((s) => `<li><b>⚡ ${s.name}:</b> ${s.text}</li>`).join('')}</ul><p>Son muy escasas (salen poco en los sobres, más en el Sobre de oro, y en la Ruta del mánager). Entra una de cada que tengas en tu mazo (máximo 3) y <b>se agotan al usarlas</b>: una vez por partido. Misil y La Elástica eligen solas su acción (Tiro y Regate). En divisiones altas el rival también las tiene.</p>
<h3>Balón parado y VAR</h3><p><b>Saque de banda</b> automático. <b>Córner:</b> centro o pase al área (también salen de rechaces del portero y de tiros bloqueados). <b>Falta:</b> tiro directo, pase o centro. <b>Penalti</b> (falta dentro del área): solo se puede tirar, contra el portero. La carta <b>VAR</b> revisa un gol rival y lo anula el ${Math.round(CFG.varChance * 100)} % de las veces.</p>
<h3>Penaltis</h3><p>Si el partido acaba empatado (o en el modo Tanda de penaltis del menú), tanda de cinco penaltis por equipo y muerte súbita. Antes eliges el orden de tus lanzadores y, si ganas el sorteo, si tiras primero o segundo (o una tanda rápida, que se resuelve sola).</p>
<p><b>Para tirar</b>, mantén el dedo en el balón: un <b>anillo de potencia</b> sube y baja solo. Arrastra hacia la portería y suelta: la <b>dirección</b> del trazo es el lado y la potencia es la del anillo al soltar (zona verde = buena; flojo = fácil de parar; zona roja = se te va alto o fuera). Si el trazo es <b>claramente curvo</b>, el balón toma rosca (engaña un poco al portero, pero cuesta bastante precisión, más de exterior); el <b>punto donde tocas</b> el balón da la altura (arriba sale raso, abajo se eleva: así se busca la escuadra o se pica a lo Panenka). Esperar 2 a 5 segundos antes de tirar calma los nervios; tirar con prisa los dispara.</p>
<p><b>Para parar</b>, desliza desde el portero hasta el punto de la portería donde quieres poner las manos (🧤): el portero se estira hasta ahí. Si el balón va a tus manos, lo blocas; si pasa cerca de ellas o te da en el cuerpo, lo despejas. Cuanto más lejos el punto, más tarda en llegar. Si te lanzas mucho antes del golpeo, el lanzador puede leerte y cambiar de lado.</p>
<p>Cuentan Definición, Técnica, Potencia y Sangre fría del lanzador; Reflejos, Colocación, Agilidad y Estirón del portero (salen de sus cualidades); la presión (si fallar es perder, la final, la muerte súbita), el cansancio y jugar en casa o fuera (poco: en las tandas reales casi no se nota). El portero rival aprende de tus últimos tiros.</p>
<h3>Narración</h3><p>Narran Tomás y Julián (personajes ficticios), que te saludan al empezar según la hora de tu dispositivo. Son voces grabadas con síntesis neuronal Supertonic 3 de Supertone Inc. (modelo con licencia OpenRAIL-M; código MIT): el narrador es la voz M1 y el comentarista, la voz M4, a 44,1 kHz y guardadas en MP3. Cada trozo se grabó dentro de su frase completa, con su entonación, y los nombres y números en mitad de frase, al final y al exclamar. No son voces de comentaristas reales. Si una frase no tiene grabación, se usa la voz del sistema cuando existe; si no, sale en subtítulos.</p>
<h3>Progresión</h3><p><b>Dinero:</b> cada partido paga taquilla y prima (más si ganas y por cada gol), multiplicado por tu división; también pagan las misiones, los logros y el primer partido del día. <b>Plantilla:</b> empiezas con futbolistas modestos y dos cracks. Cada futbolista sube de nivel con la experiencia de los partidos (más si juega de titular, marca o gana duelos) o entrenando; cada nivel suma +1 a sus cualidades (la velocidad punta es un dato real y no cambia), hasta el nivel ${MAX_LV_TXT}. Su media decide su categoría: <b>Reserva</b> (&lt; 65), <b>Titular</b> (65–74), <b>Crack</b> (75–84) y <b>Leyenda</b> (85 o más). <b>Mercado:</b> ofertas nuevas tras cada partido; puedes vender por el 70 % de su valor. <b>Vestuario:</b> cinco niveles, del de barrio al de leyenda; cada mejora da más dinero, más experiencia, más energía en el descanso y mejores fichajes. <b>Misiones diarias</b> (tres, y un Sobre de oro si las completas), <b>misiones semanales</b> (cinco, cada lunes; otro Sobre de oro si las completas), <b>pase de temporada</b> (40 niveles en 4 semanas, gratis: sobres, cartas SÚPER y fichajes Crack y Leyenda), <b>calendario de 7 días</b> (el día avanza cada día que juegas, aunque faltes alguno) y <b>Ruta del mánager</b> (premios al subir de nivel). Si vuelves tras 4 días o más, Sobre de oro y experiencia doble durante 3 partidos. Desde el 7º partido del día, la taquilla es la mitad. <b>Categorías:</b> subes y bajas con la clasificación final de la Liga (Bronce, Plata, Oro, Diamante y Leyenda): en cada una los rivales tienen mejores jugadores, mazos y cartas súper, y juegan mejor.</p>
<h3>Faltas</h3><p>Si una entrada pierde por ${CFG.foulMargin} puntos o más, es falta. También puedes hacer una falta táctica a propósito para parar la jugada.</p>
<h3>Consejos</h3><ul class="rl"><li>Guarda las cartas fuertes para los duelos importantes: tiros cerca de la portería y entradas decisivas.</li><li>Mira la carta del rival en la mesa antes de responder.</li><li>Con el balón y un rival encima, un pase suele ser más seguro que un regate.</li></ul>`;
}

// ---------- lecciones de la partida guiada ----------
const S = (c, id) => c.seen.has(id);
const LESSONS = [
  { id: 'intro', when: (c) => c.n === 0, steps: [

// ---------- v12 · PASE DE TEMPORADA (gratis, 4 semanas, 40 niveles de 250 XP) ----------
// XP: 50 por partido (+25 si ganas), 40 por misión del día y 150 por misión semanal. Cada nivel da algo; los premios
// grandes están en el 10, 20, 25, 30 y 40. Simulado (5 perfiles de jugador): el competitivo lo completa casi siempre

function passReward(lv) {

  if (lv % 10 === 0) return { pack: 'premium' }; if (lv === 15 || lv === 35) return { super: 1 };
  if (lv % 4 === 0) return { pack: 'cartas' }; return { money: 100000 };
}

  if (r.pack === 'cartas') p.freePacks++; if (r.pack === 'premium') p.freePremium = (p.freePremium || 0) + 1;
  if (r.super) { const pool = SUPER_KEYS.filter((k) => !(p.supers[k] > 0)), k = (pool.length ? pool : SUPER_KEYS)[Math.floor(Math.random() * (pool.length || SUPER_KEYS.length))]; if (pool.length) { p.supers[k] = 1; got.text = 'Carta SÚPER: ' + SPECIALS[k].name; } else { p.fichas = (p.fichas || 0) + FICHAS_OF.S; got.text = FICHAS_OF.S + ' fichas (ya tenías todas las SÚPER)'; } }
  if (r.player) { const q = shuffled(ALL().filter((x) => !p.roster[x.id] && tierOf(ovrOf(x)).id === r.player))[0]; if (q) { p.roster[q.id] = { lv: 1, xp: 0, g: 0, gl: 0 }; got.player = q.id; got.text = 'Fichaje: ' + q.name; } else { const v = Math.round(3000000 * M / 10000) * 10000; p.money += v; got.text = eur(v) + ' (ya tienes a todos los de ese nivel)'; } }
  return got;
}

// orden de la tanda: tocas a tus lanzadores en orden (o se usa el orden por tiro). v13 · aquí también el sorteo
// (quien lo gana elige tirar primero o segundo) y la «tanda rápida», que se resuelve sola. Es la única pantalla de la
// tanda con botones. Devuelve el orden (lista de índices) con .first (quién tira primero) y .quick.
function pickShootOrder() {
  return new Promise((done) => {
    const s = $('#screen'); s.classList.remove('hidden'); s.style.justifyContent = 'flex-start';
    const all = takersOf(G, H), order = [], won = Math.random() < .5; let first = won ? H : B; // el bot que gana el sorteo tira primero
    const est = (i) => { const T = PK.pressure({}), sa = pkSA(H, i), ka = pkKA(B), r = PK.mulberry(i * 977 + 13); let g = 0; for (let k = 0; k < 500; k++) if (PK.botKick(sa, ka, { P: T }, r).goal) g++; return Math.round(g / 5); };
    const pct = {}; all.forEach((i) => { pct[i] = est(i); });
    const draw = () => {
      const sa = (i) => pkSA(H, i).show;
      s.innerHTML = `<h1 style="font-size:24px">TANDA DE PENALTIS</h1>
      <div class="tkcoin ${won ? 'w' : 'l'}"><span class="coin">€</span><div><b>${won ? 'Ganas el sorteo' : 'El rival gana el sorteo'}</b><small>${won ? 'Elige si tiras primero o segundo' : 'Ha elegido tirar primero'}</small></div></div>
      ${won ? `<div class="grid2"><button class="btn ${first === H ? '' : 'sec'}" id="tk1">Tirar primero</button><button class="btn ${first === B ? '' : 'sec'}" id="tk2">Tirar segundo</button></div>` : ''}
      <p class="note">Elige el orden de tus lanzadores: toca a los 5 primeros. Si la tanda sigue, tiran los demás y, al final de cada vuelta, el portero. El porcentaje es su acierto esperado contra este portero si tiras como el bot.</p>
      <div class="lcard">${all.map((i) => { const k = order.indexOf(i), a = sa(i); return `<button class="sbr ${k >= 0 ? 'on' : ''}" data-tk="${i}"><span class="sbp">${k >= 0 ? k + 1 + 'º' : '·'}</span><b>${shortName(G.team[H][i].name)}</b><span>DEF ${a['Definición']} · SF ${a['Sangre fría']} · ${pct[i]}%</span></button>`; }).join('')}</div>
      <button class="btn" id="tkok" ${order.length && order.length < Math.min(5, all.length) ? 'disabled' : ''}>${order.length ? '✅ Usar este orden' : '⚡ Orden automático (los mejores primero)'}</button>${order.length ? '<button class="btn sec" id="tkrs">Borrar</button>' : ''}
      <button class="btn sec" id="tkquick">⏩ Tanda rápida (se juega sola)</button>`;
      s.querySelectorAll('[data-tk]').forEach((b) => { b.onclick = () => { const i = +b.dataset.tk, k = order.indexOf(i); if (k >= 0) order.splice(k, 1); else if (order.length < 5) order.push(i); sfx.pick(); draw(); }; });
      const out = (quick) => { const o = order.length ? order.concat(all.filter((i) => !order.includes(i))) : all.slice(); o.first = first; o.quick = quick; s.classList.add('hidden'); done(o); };
      $('#tkok').onclick = () => out(false);
      $('#tkquick').onclick = () => { sfx.pick(); out(true); };
      if ($('#tkrs')) $('#tkrs').onclick = () => { order.length = 0; draw(); };
      if ($('#tk1')) $('#tk1').onclick = () => { first = H; sfx.pick(); draw(); };
      if ($('#tk2')) $('#tk2').onclick = () => { first = B; sfx.pick(); draw(); };
    };
    draw();
  });
}

// ---------- jugar, reanudar y abandonar un partido de liga ----------
function playLeague() {

  const um = LG.userMatch(S); if (!um) return ligaHome();
  leagueCtx = { matchId: um.id, isHome: um.isHome, opp: um.opp, round: um.round, derby: LG.isDerby(S.userClubId, um.opp) };

// el rival de liga: siempre los mismos futbolistas (semilla del club en la temporada); dificultad = división ± nivel
// v10 · los rivales crecen durante la temporada: en la última jornada llevan la mitad del salto hasta la división de arriba
// (mazo, nivel de los futbolistas y acierto del bot). En la máxima división, +8 puntos de mazo y +1 nivel.
// v12 · o: { debut: 1ª temporada (en Bronce), noPromo: temporadas seguidas sin subir, stars: estrellas de Leyenda }
//   · debut: todos los rivales con 4 puntos de mazo menos (el de Bronce empieza con 40, como tu mazo inicial)
//   · colchón: −2 puntos por cada temporada seguida sin subir en la categoría (máximo −4); se pierde al subir
//   · Leyenda ★: +4 puntos de mazo por estrella hasta 140 y +2,5 a partir de ahí, +1 nivel cada 3 y mejor criterio
function rivalLevel(dn, g, o = {}) {
  const d = meta.DIVS[dn], up = meta.DIVS[Math.max(1, dn - 1)], top = dn === 1, st = top ? o.stars || 0 : 0;
  let base = d.budget - (o.debut ? 4 : 0) - 2 * Math.min(2, o.noPromo || 0), lv = d.lv, noise = d.noise;
  if (st) { base += st <= 11 ? 4 * st : 44 + 2.5 * (st - 11); lv += Math.floor(st / 3); noise = Math.max(1, noise - 0.1 * st); }
  return { d, budget: Math.round(base + g * (top ? 8 : 0.5 * (up.budget - d.budget))), lv: Math.min(MAX_LV, lv + Math.round(g * (top ? 1 : 0.5 * (up.lv - d.lv)))), noise: +(noise - g * (top ? 0.3 : 0.4 * (d.noise - up.noise))).toFixed(2) };
}
const careerOpts = (div) => { const c = LG.careerInfo(div); return { debut: c.done === 0 && div === 5, noPromo: c.noPromo, stars: div === 1 ? c.stars : 0 }; };
// v12 · RIVAL A TU ALTURA (tope blando): si tu mazo pasa en más de 10 puntos al del rival, o la media de tu once en más
// de 6 a la suya, el rival recupera tres cuartas partes de lo que sobra (mazo y nivel de sus futbolistas). Lo que
// pasas de esos márgenes te cuenta solo un 25 %: siempre eres favorito, pero nunca hay partidos regalados.
// Medido con bots (sim/v12bal.js, 120 partidos de 90' por punto): cada punto de mazo de ventaja vale ≈ +1,6 puntos
// porcentuales de (victorias − derrotas); +20 puntos ≈ 56 % de victorias y 12 % de derrotas.
const FAIR = { deck: 10, avg: 6, k: 0.75 };
const avgOvr = (pl) => pl.reduce((t, x) => t + ovrOf(x), 0) / pl.length;
function leagueRival(S, oppId, avoid, opt = {}) {
  const t = LG.teamOf(S, oppId), dn = opt.div || LG.rivalDiv(S, oppId), g = opt.g != null ? opt.g : LG.growth(S, opt.round || 1);
  const L = rivalLevel(dn, g, careerOpts(S.division)), d = L.d, r = LG.rngFrom(t.rivalSeed);
  const form = FORM_KEYS[Math.floor(r() * FORM_KEYS.length)];
  const fair = { deck: 0, lv: 0 };
  if (opt.myDeck != null && opt.myDeck - L.budget > FAIR.deck) fair.deck = Math.round(FAIR.k * (opt.myDeck - L.budget - FAIR.deck));
  const b = buildSide(r, { rarW: d.rarW, cardBudget: L.budget + fair.deck, avoid, roles: formSlots(form).map((q) => q.pos) });
  if (opt.myAvg != null) { const gap = opt.myAvg - avgOvr(b.players.map((x) => leveled(x, L.lv))); if (gap > FAIR.avg) fair.lv = Math.max(0, Math.min(MAX_LV - L.lv, Math.round(FAIR.k * (gap - FAIR.avg)))); }
  b.players = b.players.map((x) => leveled(x, L.lv + fair.lv));
  shuffle(SUPER_KEYS, r).slice(0, d.supers).forEach((k) => b.deck.push(mkSpecial(k)));
  return { b, form, noise: L.noise, divName: d.name, lv: L.lv + fair.lv, budget: L.budget + fair.deck, fair: fair.deck || fair.lv ? fair : null };
}

async function casMayor(T) {

  while (me < 2 && cr < 2) {
    T.panel(`<div class="casres"><b>Ronda ${round}</b><small>Tú ${me} – ${cr} Crupier</small></div>`);
    const a = rollD(2), b = rollD(2);
    ctl.reset(); ctl.setDice([{ sty: 'me' }, { sty: 'me' }, { sty: 'rv' }, { sty: 'rv' }]);
    ctl.dice[2].m.visible = ctl.dice[3].m.visible = false;
    ctl.label(`<small>RONDA ${round}</small>Tú ${me} – ${cr} Crupier`);
    await casRoll(ctl, [0, 1], a, true);
    const A = ctl.probe().area; [2, 3].forEach((k) => { const d = ctl.dice[k]; d.m.visible = true; d.m.position.set(A.x1 - 1, 3, A.zTop - 1.5); });
    sfx.casShake(); await sleep(350); await casRoll(ctl, [2, 3], b, false);
    const sa = dSum(a), sb = dSum(b);
    ctl.sums([{ idx: [0, 1], text: `TÚ <b>${sa}</b>`, cls: 'me' + (sa > sb ? ' win' : '') }, { idx: [2, 3], text: `CRUPIER <b>${sb}</b>`, cls: 'rv' + (sb > sa ? ' win' : '') }]);
    if (sa > sb) me++; else if (sb > sa) cr++; else ctl.label('<small>EMPATE</small>Se repite la ronda');
    await sleep(1300); if (sa !== sb) round++;

}

async function casCraps(T) {
  const { ctl } = T; let point = 0, n = 0;
  ctl.setDice([{ sty: 'gold' }, { sty: 'gold' }]);
  for (;;) {
    n++; const d = rollD(2), sum = d[0] + d[1];
    ctl.label(point ? `<small>TU PUNTO: ${point}</small>Saca ${point} antes que un 7` : '<small>SALIDA</small>7 u 11 ganas · 2, 3 o 12 pierdes');
    T.panel(`<div class="casres"><b>${point ? 'Punto: ' + point : 'Tirada de salida'}</b><small>Tirada ${n}</small></div>`);

// --- Generala exprés ---
async function casGenerala(T) {
  const { ctl } = T, N = 5;
  const playOne = async (mine) => {
    let d = rollD(N), keep = d.map(() => false), first = null;
    ctl.reset(); ctl.setDice(Array.from({ length: N }, () => ({ sty: mine ? 'me' : 'rv' })));
    ctl.label(mine ? '<small>TU TURNO</small>Hasta tres tiradas: toca los dados que guardas' : '<small>TURNO DEL CRUPIER</small>Tira el Crupier');
    for (let t = 1; t <= 3; t++) {
      const idx = d.map((_, k) => k).filter((k) => !keep[k]);
      if (t > 1) d = d.map((v, k) => (keep[k] ? v : 1 + Math.floor(Math.random() * 6)));
      if (!mine) { sfx.casShake(); await sleep(400); }
      await casRoll(ctl, idx, idx.map((k) => d[k]), mine);
      const h = genHand(d); if (t === 1) first = h;
      ctl.sums([{ idx: d.map((_, k) => k), text: `${h.n}`, cls: mine ? 'me' : 'rv' }]);
      if (t === 3 || h.v >= 700) break;
      if (mine) {
        const pn = T.panel(`<div class="casres"><b>${h.n}</b><small>Tirada ${t} de 3 · toca los dados que guardas</small></div><div class="genk">${d.map((v, k) => `<button class="gdie ${keep[k] ? 'k' : ''}" data-k="${k}">${v}</button>`).join('')}</div><div class="grid2"><button class="btn" data-v="roll">🎲 Tirar el resto</button><button class="btn sec" data-v="stay">Me planto</button></div>`);
        pn.querySelectorAll('[data-k]').forEach((b) => { b.onclick = () => { const k = +b.dataset.k; keep[k] = !keep[k]; b.classList.toggle('k', keep[k]); sfx.pick(); }; });
        const v = await casWait(pn, '[data-v]'); if (v === 'stay') break;
        if (keep.every(Boolean)) break;
      } else { keep = genKeep(d); if (keep.every(Boolean)) break; await sleep(700); }
    }
    return { d, h: genHand(d), served: first && first.v >= 700 };
  };
  T.panel('<div class="casres"><b>Tu turno</b><small>Cinco dados, hasta tres tiradas</small></div>');
  const me = await playOne(true); await sleep(1000);
  T.panel(`<div class="casres"><b>Tienes: ${me.h.n}</b><small>Ahora tira el Crupier</small></div>`);
  const cr = await playOne(false); await sleep(900);
  const win = me.h.v > cr.h.v || (me.h.v === cr.h.v && dSum(me.d) > dSum(cr.d));
  return { win, jackpot: me.served, txt: `Tú: ${me.h.n} (${me.d.join(' ')}) · Crupier: ${cr.h.n} (${cr.d.join(' ')})${me.served ? ' · ¡GENERALA SERVIDA!' : ''}` };
}

      try { localStorage.setItem(MGR_KEY, cv.toDataURL('image/jpeg', .86)); toast('📷 ¡Foto de mánager guardada!', 2200); sfx.place(); } catch (e) { toast('Este navegador no deja guardar la foto.', 3500); }
